<svg style="font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif" class="vr-infographic" aria-label="왜 현장효과가 낮은가: 개발에서 활용까지" xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img"><rect width="1400" height="540" rx="24" fill="#fff"/><g><text x="40" y="48" font-size="30" fill="#123451" font-weight="800" text-anchor="start">연구개발 성과가 현장효과로 이어지는 네 개의 관문</text><rect x="35" y="82" width="305" height="312" rx="18" fill="#eaf1f7" stroke="none"/><g transform="translate(143,105) scale(1)" color="#216dba"><rect x="0" y="0" width="84" height="84" rx="24" fill="white"/><rect x="3" y="3" width="78" height="78" rx="22" fill="#216dba" fill-opacity=".055"/><g stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="41" cy="42" r="25"/><circle cx="41" cy="42" r="14"/><circle cx="41" cy="42" r="4" fill="currentColor"/><path d="M42 41 L68 15 M57 15 H68 V26"/></g></g><text x="187" y="228" font-size="29" fill="#123451" font-weight="800" text-anchor="middle">수요 정의</text><text x="187" y="278" font-size="20" fill="#536b7d" font-weight="500" text-anchor="middle">문제·구매조건·운영자</text><text x="187" y="321" font-size="21" fill="#216dba" font-weight="700" text-anchor="middle">기획 단계에서 함께 확정</text><path d="M345,233 L372,233" stroke="#007f91" stroke-width="3" fill="none"/><path d="M362,227 L372,233 L362,239" stroke="#007f91" stroke-width="3" fill="none"/><rect x="380" y="82" width="305" height="312" rx="18" fill="#eef6f5" stroke="none"/><g transform="translate(488,105) scale(1)" color="#007f91"><rect x="0" y="0" width="84" height="84" rx="24" fill="white"/><rect x="3" y="3" width="78" height="78" rx="22" fill="#007f91" fill-opacity=".055"/><g stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M31 14 H51 M36 14 V35 L20 59 Q17 68 27 69 H55 Q65 68 62 59 L46 35 V14"/><path d="M29 49 H53"/><path d="M33 59 L39 64 L51 53"/></g></g><text x="532" y="228" font-size="29" fill="#123451" font-weight="800" text-anchor="middle">현장 실증</text><text x="532" y="278" font-size="20" fill="#536b7d" font-weight="500" text-anchor="middle">실험실과 재난환경의 간극</text><text x="532" y="321" font-size="21" fill="#007f91" font-weight="700" text-anchor="middle">실제 환경에서 성능 검증</text><path d="M690,233 L717,233" stroke="#007f91" stroke-width="3" fill="none"/><path d="M707,227 L717,233 L707,239" stroke="#007f91" stroke-width="3" fill="none"/><rect x="725" y="82" width="305" height="312" rx="18" fill="#eaf1f7" stroke="none"/><g transform="translate(833,105) scale(1)" color="#d67925"><rect x="0" y="0" width="84" height="84" rx="24" fill="white"/><rect x="3" y="3" width="78" height="78" rx="22" fill="#d67925" fill-opacity=".055"/><g stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M35 29 L42 22 Q54 10 65 22 Q76 34 64 45 L56 53 M47 54 L39 62 Q27 74 16 62 Q5 50 17 38 L25 30 M28 51 L54 25"/></g></g><text x="877" y="228" font-size="29" fill="#123451" font-weight="800" text-anchor="middle">도입 책임</text><text x="877" y="278" font-size="20" fill="#536b7d" font-weight="500" text-anchor="middle">개발·구매·운영 주체 분리</text><text x="877" y="321" font-size="21" fill="#d67925" font-weight="700" text-anchor="middle">역할·예산·인수조건 연결</text><path d="M1035,233 L1062,233" stroke="#007f91" stroke-width="3" fill="none"/><path d="M1052,227 L1062,233 L1052,239" stroke="#007f91" stroke-width="3" fill="none"/><rect x="1070" y="82" width="305" height="312" rx="18" fill="#eef6f5" stroke="none"/><g transform="translate(1178,105) scale(1)" color="#7653ad"><rect x="0" y="0" width="84" height="84" rx="24" fill="white"/><rect x="3" y="3" width="78" height="78" rx="22" fill="#7653ad" fill-opacity=".055"/><g stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M18 17 V67 H69"/><path d="M29 55 V43 M43 55 V34 M57 55 V23" stroke-width="7"/><path d="M26 30 L40 21 L51 24 L66 11"/></g></g><text x="1222" y="228" font-size="29" fill="#123451" font-weight="800" text-anchor="middle">성과 측정</text><text x="1222" y="278" font-size="20" fill="#536b7d" font-weight="500" text-anchor="middle">논문·특허에 편중된 평가</text><text x="1222" y="321" font-size="21" fill="#7653ad" font-weight="700" text-anchor="middle">사용·운영·확산까지 측정</text><rect x="30" y="462" width="1340" height="56" rx="12" fill="#123451" stroke="none"/><text x="700" y="498" font-size="25" fill="#fff" font-weight="700" text-anchor="middle">현장효과 = 기술성능 × 도입가능성 × 운영지속성  ·  전략기획의 개념식</text></g></svg>