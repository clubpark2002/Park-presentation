<svg style="font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif" class="vr-infographic" aria-label="재난안전 기술수요: 세 갈래 수요, 하나의 실행" xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img"><rect width="1400" height="540" rx="24" fill="#fff"/><g><text x="40" y="43" font-size="29" fill="#123451" font-weight="800" text-anchor="start">생활 속 문제에서 지역 현안, 긴급재난까지</text><rect x="35" y="75" width="430" height="255" rx="18" fill="#eaf1f7" stroke="none"/><g transform="translate(60,100) scale(1)" color="#216dba"><rect x="0" y="0" width="84" height="84" rx="24" fill="white"/><rect x="3" y="3" width="78" height="78" rx="22" fill="#216dba" fill-opacity=".055"/><g stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="41" cy="27" r="11"/><path d="M21 66 V57 Q21 43 41 43 Q61 43 61 57 V66 Z" fill="currentColor" fill-opacity=".14"/><path d="M18 20 Q5 31 18 42 M64 20 Q77 31 64 42 M11 52 V65 M71 52 V65"/></g></g><text x="165" y="145" font-size="31" fill="#216dba" font-weight="800" text-anchor="start">국민 수요</text><text x="63" y="230" font-size="23" fill="#536b7d" font-weight="500" text-anchor="start">피난약자 대피 · 생활안전</text><text x="63" y="264" font-size="23" fill="#536b7d" font-weight="500" text-anchor="start">2025 공모전 우수작 10건</text><path d="M250,330 L250,370" stroke="#216dba" stroke-width="4" fill="none"/><path d="M250,370 L700,370" stroke="#216dba" stroke-width="4" fill="none"/><rect x="500" y="75" width="430" height="255" rx="18" fill="#eaf1f7" stroke="none"/><g transform="translate(525,100) scale(1)" color="#007f91"><rect x="0" y="0" width="84" height="84" rx="24" fill="white"/><rect x="3" y="3" width="78" height="78" rx="22" fill="#007f91" fill-opacity=".055"/><g stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M16 66 V33 H34 V66 M34 66 V16 H56 V66 M56 66 V40 H69 V66 M11 68 H75" fill="currentColor" fill-opacity=".