<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Club-Park Presentation Hub</title>
  <meta name="description" content="AI, 국가 정책, 연구 기획부터 라이프까지 — 유튜브 스타일로 한눈에 탐색하고 즉시 발표하는 프레젠테이션 아카이브">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ff0033'/%3E%3Cpolygon points='12,9 24,16 12,23' fill='%23ffffff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===== Reset & YouTube-Inspired Design Tokens ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #ffffff;
      --bg-elevated: #f8f8f8;
      --bg-chip: #f2f2f2;
      --bg-chip-hover: #e5e5e5;
      --bg-hover: #f2f2f2;
      --border: #e5e5e5;
      --ink: #0f0f0f;
      --ink-muted: #606060;
      --ink-subtle: #909090;
      --brand-red: #ff0033;
      --primary: #0f62fe;
      --chip-active-bg: #0f0f0f;
      --chip-active-ink: #ffffff;

      --cat-ai: #7c3aed;
      --cat-plan: #ea580c;
      --cat-policy: #0284c7;
      --cat-life: #0d9488;

      --header-h: 56px;
      --sidebar-w: 236px;
      --sidebar-mini-w: 74px;

      --f-body: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --f-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0f0f0f;
      --bg-elevated: #181818;
      --bg-chip: #272727;
      --bg-chip-hover: #3f3f3f;
      --bg-hover: #272727;
      --border: #272727;
      --ink: #f1f1f1;
      --ink-muted: #aaaaaa;
      --ink-subtle: #717171;
      --brand-red: #ff0033;
      --primary: #3ea6ff;
      --chip-active-bg: #f1f1f1;
      --chip-active-ink: #0f0f0f;

      --cat-ai: #a78bfa;
      --cat-plan: #fb923c;
      --cat-policy: #38bdf8;
      --cat-life: #2dd4bf;

      color-scheme: dark;
    }

    body {
      font-family: var(--f-body);
      font-size: 14px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    body.viewing {
      overflow: hidden;
    }

    button, input, select {
      font-family: inherit;
      color: inherit;
    }

    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    mark.hl {
      background: rgba(255, 214, 10, 0.32);
      color: inherit;
      padding: 0 2px;
      border-radius: 3px;
      font-weight: 700;
    }

    /* ===== Top Sticky YouTube Header ===== */
    .yt-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--header-h);
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 16px;
      z-index: 45;
    }

    .yt-header-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--ink);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .icon-btn:hover {
      background: var(--bg-hover);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .yt-logo {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: var(--ink);
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.03em;
      user-select: none;
    }

    .yt-logo-badge {
      width: 30px;
      height: 22px;
      border-radius: 6px;
      background: var(--brand-red);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(255, 0, 51, 0.35);
    }

    .yt-logo-badge svg {
      width: 12px;
      height: 12px;
      fill: #ffffff;
    }

    .yt-logo sup {
      font-family: var(--f-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--ink-muted);
      margin-left: -4px;
      letter-spacing: 0.02em;
    }

    /* Center Search Pill */
    .yt-header-center {
      flex: 1;
      max-width: 620px;
      display: flex;
      align-items: center;
    }

    .search-box {
      width: 100%;
      display: flex;
      align-items: center;
      height: 40px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--bg-elevated);
      overflow: hidden;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .search-box:focus-within {
      border-color: var(--primary);
      background: var(--bg);
      box-shadow: 0 0 0 1px var(--primary);
    }

    .search-lead-icon {
      width: 16px;
      height: 16px;
      margin-left: 16px;
      color: var(--ink-subtle);
      flex-shrink: 0;
    }

    #searchInput {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      padding: 0 12px;
      font-size: 14px;
      color: var(--ink);
      outline: none;
    }

    #searchInput::placeholder {
      color: var(--ink-subtle);
    }

    .search-clear {
      background: none;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 15px;
      display: none;
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .search-kbd {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--ink-subtle);
      background: var(--bg-chip);
      border: 1px solid var(--border);
      padding: 2px 7px;
      border-radius: 999px;
      margin-right: 12px;
      pointer-events: none;
      flex-shrink: 0;
    }

    /* Right Controls */
    .yt-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .deck-count-pill {
      font-family: var(--f-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--bg-chip);
      color: var(--ink-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      display: inline-block;
    }

    .icon-sun { display: none; }
    [data-theme="dark"] .icon-sun { display: block; }
    [data-theme="dark"] .icon-moon { display: none; }

    /* ===== App Body Layout (Sidebar + Main Feed) ===== */
    .yt-layout {
      display: flex;
      padding-top: var(--header-h);
      min-height: 100vh;
    }

    /* Mobile Backdrop for Drawer */
    .sidebar-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 38;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    body.sidebar-open .sidebar-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    /* Left Sidebar */
    .yt-sidebar {
      position: fixed;
      top: var(--header-h);
      left: 0;
      bottom: 0;
      width: var(--sidebar-w);
      background: var(--bg);
      border-right: 1px solid var(--border);
      padding: 12px 12px 24px;
      overflow-y: auto;
      z-index: 40;
      transition: width 0.2s ease, transform 0.22s ease;
      scrollbar-width: thin;
    }

    body.sidebar-mini .yt-sidebar {
      width: var(--sidebar-mini-w);
      padding: 12px 6px;
    }

    .side-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .side-divider {
      height: 1px;
      background: var(--border);
      margin: 12px 8px;
    }

    .side-heading {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-subtle);
      padding: 6px 12px;
    }

    body.sidebar-mini .side-heading,
    body.sidebar-mini .side-footer,
    body.sidebar-mini .side-count {
      display: none;
    }

    .side-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--ink);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: background 0.15s;
    }

    .side-btn:hover {
      background: var(--bg-hover);
    }

    .side-btn.active {
      background: var(--bg-chip);
      font-weight: 700;
    }

    .side-btn-left {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .side-btn svg {
      width: 19px;
      height: 19px;
      flex-shrink: 0;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
    }

    .side-cat-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
      margin: 0 4px;
    }

    .side-count {
      font-family: var(--f-mono);
      font-size: 11px;
      color: var(--ink-subtle);
    }

    body.sidebar-mini .side-btn {
      flex-direction: column;
      justify-content: center;
      padding: 11px 4px;
      gap: 5px;
      font-size: 10px;
      text-align: center;
    }

    body.sidebar-mini .side-btn-left {
      flex-direction: column;
      gap: 5px;
    }

    .side-footer {
      margin-top: 14px;
      padding: 12px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 12px;
      color: var(--ink-muted);
      line-height: 1.6;
    }

    .side-footer b {
      color: var(--ink);
      display: block;
      margin-bottom: 4px;
    }

    .side-footer kbd {
      font-family: var(--f-mono);
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
    }

    /* ===== Main Content Area ===== */
    .yt-main {
      flex: 1;
      margin-left: var(--sidebar-w);
      min-width: 0;
      transition: margin-left 0.2s ease;
    }

    body.sidebar-mini .yt-main {
      margin-left: var(--sidebar-mini-w);
    }

    /* Sticky Category & Style Chips Bar */
    .yt-chips-bar {
      position: sticky;
      top: var(--header-h);
      z-index: 25;
      background: color-mix(in srgb, var(--bg) 94%, transparent);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .yt-chips-bar::-webkit-scrollbar { display: none; }

    .chips-left {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: nowrap;
    }

    .chip-btn {
      border: none;
      background: var(--bg-chip);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s, color 0.15s;
    }

    .chip-btn:hover {
      background: var(--bg-chip-hover);
    }

    .chip-btn.active {
      background: var(--chip-active-bg);
      color: var(--chip-active-ink);
    }

    .chip-btn b {
      font-family: var(--f-mono);
      font-size: 11px;
      opacity: 0.75;
    }

    .chip-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    .chips-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .sort-select {
      background: var(--bg-chip);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Filter Status Bar (shown when filtered/searched) */
    .filter-status {
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding: 10px 16px;
      border-radius: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--ink-muted);
    }

    .filter-status.show {
      display: flex;
    }

    .filter-status b {
      color: var(--ink);
    }

    .reset-filter-btn {
      background: var(--bg-chip);
      border: 1px solid var(--border);
      color: var(--ink);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .reset-filter-btn:hover {
      background: var(--bg-chip-hover);
    }

    /* ===== YouTube Video Grid (3~4 Columns) ===== */
    .yt-feed {
      padding: 22px 24px 72px;
    }

    .yt-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 28px 18px;
    }

    /* Optional Compact List Mode */
    .yt-grid.list-mode {
      grid-template-columns: 1fr;
      max-width: 1080px;
      gap: 14px;
    }

    .yt-card {
      display: flex;
      flex-direction: column;
      cursor: pointer;
      border-radius: 14px;
      transition: transform 0.18s ease;
    }

    .yt-grid.list-mode .yt-card {
      flex-direction: row;
      gap: 18px;
      align-items: flex-start;
      padding: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
    }

    .yt-grid.list-mode .yt-thumb {
      width: 320px;
      flex-shrink: 0;
    }

    /* 16:9 Thumbnail Box */
    .yt-thumb {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      background: #101624;
      border: 1px solid var(--border);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .yt-thumb-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.45s cubic-bezier(0.2, 0.7, 0.2, 1);
    }

    .yt-card:hover .yt-thumb-img {
      transform: scale(1.06);
    }

    /* Cinematic Gradient Vignette Overlay on Thumbnail */
    .yt-thumb-shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 12, 22, 0.52) 0%, rgba(8, 12, 22, 0.14) 38%, rgba(8, 12, 22, 0.90) 100%);
    }

    /* Top Badges on Thumbnail */
    .yt-thumb-top {
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      z-index: 2;
    }

    .yt-top-left-badges {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .yt-ep-badge {
      font-family: var(--f-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 5px;
      background: rgba(10, 14, 24, 0.78);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
    }

    .yt-new-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 3px 7px;
      border-radius: 5px;
      background: var(--brand-red);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(255, 0, 51, 0.4);
    }

    .yt-style-badge {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.06em;
      padding: 3px 8px;
      border-radius: 5px;
      text-transform: uppercase;
      backdrop-filter: blur(6px);
    }

    .yt-style-badge.cinematic {
      background: rgba(0, 210, 255, 0.88);
      color: #041019;
    }

    .yt-style-badge.briefing {
      background: rgba(255, 255, 255, 0.92);
      color: #0f172a;
    }

    .yt-style-badge.mckinsey {
      background: rgba(0, 112, 173, 0.92);
      color: #ffffff;
    }

    .yt-style-badge.interactive {
      background: rgba(124, 58, 237, 0.88);
      color: #ffffff;
    }

    /* Poster Hook Overlay inside Thumbnail (Distinct from Title below) */
    .yt-thumb-poster {
      position: absolute;
      left: 12px;
      right: 72px;
      bottom: 12px;
      z-index: 2;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
    }

    .yt-thumb-cat {
      display: inline-block;
      font-family: var(--f-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 3px;
    }

    .yt-thumb-headline {
      font-size: 14.5px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -0.02em;
      color: rgba(255, 255, 255, 0.96);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: keep-all;
    }

    /* 밝은 배경 썸네일에서는 검은색 타이포그래피를 사용 */
    .yt-thumb.light-thumb .yt-thumb-shade {
      background: linear-gradient(180deg, rgba(255,255,255,.28) 0%, rgba(255,255,255,.08) 38%, rgba(255,255,255,.82) 100%);
    }
    .yt-thumb.light-thumb .yt-thumb-poster {
      color: #111827;
      text-shadow: 0 1px 4px rgba(255,255,255,.8);
    }
    .yt-thumb.light-thumb .yt-thumb-cat,
    .yt-thumb.light-thumb .yt-thumb-headline {
      color: #111827;
      text-shadow: 0 1px 4px rgba(255,255,255,.9);
    }

    /* Bottom-Right YouTube Duration / Slide Count Pill */
    .yt-duration {
      position: absolute;
      right: 8px;
      bottom: 10px;
      z-index: 3;
      background: rgba(0, 0, 0, 0.86);
      color: #ffffff;
      font-family: var(--f-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 5px;
      letter-spacing: 0.02em;
      border: 1px solid rgba(255, 255, 255, 0.16);
    }

    /* Center Play Button on Hover */
    .yt-play-hover {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.25);
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 2;
    }

    .yt-card:hover .yt-play-hover {
      opacity: 1;
    }

    .yt-play-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 0, 51, 0.92);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5);
      transform: scale(0.9);
      transition: transform 0.2s ease;
    }

    .yt-card:hover .yt-play-circle {
      transform: scale(1);
    }

    .yt-play-circle svg {
      width: 18px;
      height: 18px;
      fill: #ffffff;
      margin-left: 2px;
    }

    /* Bottom Progress Bar Accent on Thumbnail */
    .yt-thumb-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.18);
      z-index: 3;
    }

    .yt-thumb-bar i {
      display: block;
      height: 100%;
      width: 0%;
      background: var(--brand-red);
      transition: width 0.35s ease;
    }

    .yt-card:hover .yt-thumb-bar i {
      width: 100%;
    }

    /* Card Details Below Thumbnail */
    .yt-meta {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding-top: 12px;
    }

    .yt-grid.list-mode .yt-meta {
      padding-top: 4px;
      flex: 1;

    const $ = id => document.getElementById(id);
    const pad = n => String(n + 1).padStart(2, '0');
    const esc = s => String(s).replace(/[&<>\"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '\"':'&quot;' }[c]));
    let filterCat = '전체', filterStyle = 'all', sortBy = 'latest', currentId = null, isListMode = false;
    const parseSlideCount = s => { const m = String(s).match(/\d+/); return m ? Number(m[0]) : 0; };
    const thumbUrl = id => id ? `https://images.unsplash.com/${id}?auto=format&fit=crop&w=720&q=80` : '';
    function getFilteredDecks(){
      const q = $('searchInput').value.trim().toLowerCase();
      const a = DECKS.filter(d => (filterCat === '전체' || d.cat === filterCat) && (filterStyle === 'all' || (filterStyle === 'BRIEFING' ? ['BRIEFING','MCKINSEY'].includes(d.style) : d.style === filterStyle)) && (!q || `${d.title} ${d.hook||''} ${d.desc||''}`.toLowerCase().includes(q)));
      if(sortBy === 'slides-desc') a.sort((x,y)=>parseSlideCount(y.slides)-parseSlideCount(x.slides));
      if(sortBy === 'slides-asc') a.sort((x,y)=>parseSlideCount(x.slides)-parseSlideCount(y.slides));
      if(sortBy === 'title') a.sort((x,y)=>x.title.localeCompare(y.title,'ko'));
      return a;
    }
    function renderSidebar(){
      const cats = ['전체', ...new Set(DECKS.map(d => d.cat))];
      $('sideMainGroup').innerHTML = `<button class="side-btn ${filterCat==='전체'&&filterStyle==='all'?'active':''}" data-nav="all"><span class="side-btn-left">⌂<span>홈 (전체)</span></span><span class="side-count">${DECKS.length}</span></button><button class="side-btn ${filterStyle==='CINEMATIC'?'active':''}" data-style="CINEMATIC"><span class="side-btn-left">🎬<span>시네마틱 덱</span></span></button><button class="side-btn ${filterStyle==='BRIEFING'?'active':''}" data-style="BRIEFING"><span class="side-btn-left">📊<span>브리핑 · 맥킨지</span></span></button><button class="side-btn ${filterStyle==='INTERACTIVE'?'active':''}" data-style="INTERACTIVE"><span class="side-btn-left">⚡<span>다크 인터랙티브</span></span></button>`;
      $('sideCatGroup').innerHTML = cats.map(cat => { const color=CAT_COLORS[cat]||'var(--ink-subtle)'; return `<button class="side-btn ${filterCat===cat?'active':''}" data-cat="${esc(cat)}"><span class="side-btn-left"><span class="side-cat-dot" style="background:${color}"></span><span>${esc(cat==='전체'?'전체 카테고리':cat==='정책·R&D'?'정책':cat)}</span></span><span class="side-count">${DECKS.filter(d=>cat==='전체'||d.cat===cat).length}</span></button>`; }).join('');
    }
    function renderChips(){
      const cats=[...new Set(DECKS.map(d=>d.cat))];
      $('chipBar').innerHTML = `<button class="chip-btn ${filterCat==='전체'?'active':''}" data-cat="전체">전체 <b>${DECKS.length}</b></button>${cats.map(cat=>`<button class="chip-btn ${filterCat===cat?'active':''}" data-cat="${esc(cat)}">${esc(cat)} <b>${DECKS.filter(d=>d.cat===cat).length}</b></button>`).join('')}<span class="chip-sep"></span><button class="chip-btn ${filterStyle==='all'?'active':''}" data-style="all">전체 스타일</button><button class="chip-btn ${filterStyle==='CINEMATIC'?'active':''}" data-style="CINEMATIC">🎬 시네마틱</button><button class="chip-btn ${filterStyle==='BRIEFING'?'active':''}" data-style="BRIEFING">📊 브리핑</button><button class="chip-btn ${filterStyle==='INTERACTIVE'?'active':''}" data-style="INTERACTIVE">⚡ 인터랙티브</button>`;
    }
    function renderCards(){
      const list=getFilteredDecks();
      $('cardGrid').innerHTML=list.map(d=>{ const thumbCat=d.cat==='정책·R&D'?'정책':d.cat; const catColor=CAT_COLORS[d.cat]||'var(--primary)'; const tone=['BRIEFING','MCKINSEY'].includes(d.style)?' light-thumb':''; return `<article class="yt-card" data-id="${d.id}"><div class="yt-thumb${tone}"><div class="yt-thumb-img" style="background-image:url('${thumbUrl(d.thumb)}')"></div><div class="yt-thumb-shade"></div><div class="yt-thumb-poster"><span class="yt-thumb-cat">${esc(thumbCat)} · ${esc(d.style)}</span><div class="yt-thumb-headline">${esc(d.hook||d.title)}</div></div><span class="yt-duration">${esc(d.slides)}</span><div class="yt-play-hover"><div class="yt-play-circle">▶</div></div></div><div class="yt-meta"><div class="yt-avatar" style="background:${catColor}" title="${esc(thumbCat)} 카테고리">${esc(thumbCat.slice(0,2))}</div><div class="yt-info"><h3 class="yt-title">${esc(d.title)}</h3><div class="yt-subline">${esc(thumbCat)} · ${esc(d.style)} · ${esc(d.slides)}</div><p class="yt-desc">${esc(d.desc||'')}</p></div></div></article>`; }).join('');
      $('emptyState').classList.toggle('show',list.length===0);
    }
    function resetAllFilters(){ filterCat='전체'; filterStyle='all'; sortBy='latest'; $('sortSelect').value='latest'; $('searchInput').value=''; refreshUI(); }
    function refreshUI(){ renderSidebar(); renderChips(); renderCards(); }
    function buildViewer(){ $('viewerRail').innerHTML=DECKS.map(d=>`<button class="rail-pill" data-id="${d.id}">${esc(d.title)}</button>`).join(''); $('viewerStage').innerHTML=DECKS.map(d=>`<div class="viewer-frame" id="frame-${d.id}"><iframe id="iframe-${d.id}" title="${esc(d.title)}"></iframe></div>`).join(''); }
    function openDeck(id,push=true){ const d=DECKS.find(x=>x.id===id); if(!d)return showHub(push); currentId=d.id; document.body.classList.add('viewing'); document.querySelectorAll('.viewer-frame').forEach(f=>f.classList.toggle('active',f.id===`frame-${d.id}`)); document.querySelectorAll('.rail-pill').forEach(p=>p.classList.toggle('active',p.dataset.id===d.id)); const frame=$(`iframe-${d.id}`); if(frame&&!frame.src) frame.src=d.src; if(push) history.replaceState(null,'',`#tab=${id}`); }

    function showHub(push = true) {
      const last = currentId;
      currentId = null;
      document.body.classList.remove('viewing');
      document.title = 'Club-Park Presentation Hub';
      if (document.activeElement && document.activeElement.tagName === 'IFRAME') {
        document.activeElement.blur();
        window.focus();
      }

      if (last) {
        const lastCard = document.querySelector(`.yt-card[data-id="${last}"]`);
        if (lastCard) lastCard.scrollIntoView({ block: 'nearest' });
      }

      if (push) history.replaceState(null, '', '#hub');
    }

    function stepDeck(dir) {
      const idx = DECKS.findIndex(d => d.id === currentId);
      if (idx < 0) return;
      const nextIdx = (idx + dir + DECKS.length) % DECKS.length;
      openDeck(DECKS[nextIdx].id);
    }

    function routeFromHash() {
      const m = location.hash.match(/#tab=([^&]+)/);
      if (m) {
        openDeck(decodeURIComponent(m[1]), false);
      } else {
        showHub(false);
      }
    }

    // 사이드바 접기/펼치기 (데스크탑은 미니 모드 토글, 태블릿/모바일은 드로어 토글)
    $('sidebarToggle').addEventListener('click', () => {
      if (window.innerWidth <= 1024) {
        document.body.classList.toggle('sidebar-open');
      } else {
        document.body.classList.toggle('sidebar-mini');
      }
    });

    $('sidebarBackdrop').addEventListener('click', () => {
      document.body.classList.remove('sidebar-open');
    });

    // 로고 클릭 시 전체 보기 초기화
    $('logoHome').addEventListener('click', e => {
      e.preventDefault();
      resetAllFilters();
      showHub();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 그리드 / 리스트 보기 토글
    $('viewModeToggle').addEventListener('click', () => {
      isListMode = !isListMode;
      $('cardGrid').classList.toggle('list-mode', isListMode);
    });

    // 테마 전환
    $('themeToggle').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // 좌측 사이드바 클릭 이벤트
    $('sidebar').addEventListener('click', e => {
      const btn = e.target.closest('.side-btn');
      if (!btn) return;
      if (btn.dataset.nav === 'all') {
        filterCat = '전체';
        filterStyle = 'all';
      } else if (btn.dataset.style) {
        filterStyle = btn.dataset.style;
      } else if (btn.dataset.cat) {
        filterCat = btn.dataset.cat;
      }
      document.body.classList.remove('sidebar-open');
      refreshUI();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // 상단 칩 바 클릭 이벤트
    $('chipBar').addEventListener('click', e => {
      const btn = e.target.closest('.chip-btn');
      if (!btn) return;
      if (btn.dataset.cat) {
        filterCat = btn.dataset.cat;
      } else if (btn.dataset.style) {
        filterStyle = btn.dataset.style;
      }
      refreshUI();
    });

    // 정렬 변경
    $('sortSelect').addEventListener('change', e => {
      sortBy = e.target.value;
      renderCards();
    });

    // 필터 초기화 버튼
    $('resetFilterBtn').addEventListener('click', resetAllFilters);
    $('emptyResetBtn').addEventListener('click', resetAllFilters);

    // 검색 입력 이벤트
    $('searchInput').addEventListener('input', e => {
      $('searchClear').classList.toggle('visible', !!e.target.value);
      renderCards();
    });

    $('searchClear').addEventListener('click', () => {
      $('searchInput').value = '';
      $('searchClear').classList.remove('visible');
      $('searchInput').focus();
      renderCards();
    });

    // 카드 클릭 시 뷰어 열기
    $('cardGrid').addEventListener('click', e => {
      const card = e.target.closest('.yt-card');
      if (card) openDeck(card.dataset.id);
    });

    $('viewerRail').addEventListener('click', e => {
      const pill = e.target.closest('.rail-pill');
      if (pill) openDeck(pill.dataset.id);
    });

    $('viewerBack').addEventListener('click', () => showHub());
    $('viewerPrev').addEventListener('click', () => stepDeck(-1));
    $('viewerNext').addEventListener('click', () => stepDeck(1));
    $('viewerFullscreen').addEventListener('click', () => {
      document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
    });

    window.addEventListener('scroll', () => {
      $('scrollTop').classList.toggle('visible', window.scrollY > 300);
    });
    $('scrollTop').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    window.addEventListener('keydown', e => {
      if (!currentId && e.target !== $('searchInput') && (e.key === '/' || ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'))) {
        e.preventDefault();
        $('searchInput').focus();
        return;
      }

      if (!currentId) {
        if (e.key === 'Escape' && document.body.classList.contains('sidebar-open')) {
          document.body.classList.remove('sidebar-open');
        }
        return;
      }

      if (e.key === 'Escape') {
        e.preventDefault();
        showHub();
        return;
      }

      try {
        $(`iframe-${currentId}`).contentWindow.dispatchEvent(new KeyboardEvent('keydown', {
          key: e.key, code: e.code, keyCode: e.keyCode, which: e.which, bubbles: true
        }));
      } catch (err) { }
    });

    window.addEventListener('hashchange', routeFromHash);

    // 초기화
    if ($('deckCountBadge')) $('deckCountBadge').textContent = `${DECKS.length} DECKS`;
    refreshUI();
    buildViewer();
    routeFromHash();
  </script>
